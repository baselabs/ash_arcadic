name: Canary (ArcadeDB latest)

# Drift tripwire. CI's live suite runs a digest-pinned ArcadeDB so a landing's verdict is
# reproducible; this workflow runs the same suite, on every build, against the moving `latest` image so an
# upstream behavior change (e.g. the 26.8→26.9 FULL_TEXT DDL change, or the 26.11
# DatabaseNotFoundException rename) surfaces here, loudly, before the next deliberate pin
# bump. It reads an input that changes outside this repository, so the same commit can pass
# today and fail tomorrow: it never gates a landing and has no `qualified` job.
#
# History: 2026-11-01 drift (run 41327753934): :latest = 26.11.1-SNAPSHOT renamed the
# missing-database exception to DatabaseNotFoundException → :server_error (was
# :database_not_found). Resolved the same day by arcadic 1.2.3 (shipped from 1.2.2).
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

concurrency:
  group: canary-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Every run step is bash -eo pipefail: a failure behind a pipe fails its step.
defaults:
  run:
    shell: bash

jobs:
  latest:
    name: canary (ArcadeDB latest)
    uses: ./.github/workflows/integration.yml
    with:
      image: arcadedata/arcadedb:latest
