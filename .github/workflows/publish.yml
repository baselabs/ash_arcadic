name: Publish to Hex.pm

on:
  workflow_dispatch:
    inputs:
      release_commit:
        description: Full lowercase SHA of the landed release commit
        required: true
        type: string
      qualification_run:
        description: CI run ID that produced the release archives. Reuse it on every retry.
        type: string

permissions: {}

concurrency:
  group: publish
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  HEX_VERSION_URL: https://raw.githubusercontent.com/baselabs/.github/3bfbb84692a65b4d2c03dc3b7932353026fe6943/.github/actions/hex-publish/hex-version

jobs:
  upload:
    if: contains(fromJSON('["corepay","palermo-git"]'), github.actor) && contains(fromJSON('["corepay","palermo-git"]'), github.triggering_actor)
    environment: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 90 # no green run yet
    permissions:
      contents: read
      actions: read
      id-token: write
    outputs:
      qualification-run: ${{ steps.hex.outputs.qualification-run }}
      qualification-sha256: ${{ steps.hex.outputs.qualification-sha256 }}
    steps:
      - name: Require the default branch and a full release commit
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RELEASE_COMMIT: ${{ inputs.release_commit }}
        run: |
          [[ "$GITHUB_REF" == "refs/heads/$DEFAULT_BRANCH" ]] ||
            { echo "::error::Dispatch from the default branch"; exit 1; }
          [[ "$RELEASE_COMMIT" =~ ^[0-9a-f]{40}$ ]] ||
            { echo "::error::release_commit must be a full lowercase commit SHA"; exit 1; }

      - name: Check out the release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_commit }}
          fetch-depth: 0
          persist-credentials: false

      # Run the reader from the default-branch workflow commit. The release checkout is data.
      - name: Read the release commit's toolchain
        id: versions
        env:
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          git show "$WORKFLOW_SHA:scripts/toolchain.sh" > "$RUNNER_TEMP/toolchain.sh"
          bash "$RUNNER_TEMP/toolchain.sh" .tool-versions >> "$GITHUB_OUTPUT"

      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: ${{ steps.versions.outputs.elixir }}
          otp-version: ${{ steps.versions.outputs.otp }}
          version-type: strict
          install-hex: false
          install-rebar: false

      - name: Verify BEAM and install the shared action's Hex client
        working-directory: ${{ runner.temp }}
        env:
          EXPECTED_ELIXIR: ${{ steps.versions.outputs.elixir }}
          EXPECTED_OTP: ${{ steps.versions.outputs.otp }}
        run: |
          test ! -e mix.exs
          bash ./toolchain.sh --installed "elixir=$EXPECTED_ELIXIR" "erlang=$EXPECTED_OTP"
          hex_version="$(curl --fail --silent --show-error --max-time 30 "$HEX_VERSION_URL")"
          [[ "$hex_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          mix local.hex "$hex_version" --force

      - name: Upload the qualified archives
        id: hex
        uses: baselabs/.github/.github/actions/hex-publish@3bfbb84692a65b4d2c03dc3b7932353026fe6943
        with:
          operation: upload
          package: ash_arcadic
          package-directory: .
          release-commit: ${{ inputs.release_commit }}
          qualification-run: ${{ inputs.qualification_run }}
          organization-read-key: ${{ secrets.HEX_ORG_KEY_PUBLISH_API_READ }}

  read-back:
    needs: upload
    if: contains(fromJSON('["corepay","palermo-git"]'), github.actor) && contains(fromJSON('["corepay","palermo-git"]'), github.triggering_actor)
    runs-on: ubuntu-24.04
    timeout-minutes: 90 # no green run yet
    permissions:
      contents: read
      actions: read
    outputs:
      commit: ${{ steps.hex.outputs.commit }}
    steps:
      - name: Check out the release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_commit }}
          fetch-depth: 0
          persist-credentials: false

      - name: Read the release commit's toolchain
        id: versions
        env:
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          git show "$WORKFLOW_SHA:scripts/toolchain.sh" > "$RUNNER_TEMP/toolchain.sh"
          bash "$RUNNER_TEMP/toolchain.sh" .tool-versions >> "$GITHUB_OUTPUT"

      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: ${{ steps.versions.outputs.elixir }}
          otp-version: ${{ steps.versions.outputs.otp }}
          version-type: strict
          install-hex: false
          install-rebar: false

      - name: Verify BEAM and install the shared action's Hex client
        working-directory: ${{ runner.temp }}
        env:
          EXPECTED_ELIXIR: ${{ steps.versions.outputs.elixir }}
          EXPECTED_OTP: ${{ steps.versions.outputs.otp }}
        run: |
          test ! -e mix.exs
          bash ./toolchain.sh --installed "elixir=$EXPECTED_ELIXIR" "erlang=$EXPECTED_OTP"
          hex_version="$(curl --fail --silent --show-error --max-time 30 "$HEX_VERSION_URL")"
          [[ "$hex_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          mix local.hex "$hex_version" --force

      - name: Verify the archives served by Hex
        id: hex
        uses: baselabs/.github/.github/actions/hex-publish@3bfbb84692a65b4d2c03dc3b7932353026fe6943
        with:
          operation: read-back
          package: ash_arcadic
          package-directory: .
          release-commit: ${{ inputs.release_commit }}
          qualification-run: ${{ needs.upload.outputs.qualification-run }}
          qualification-sha256: ${{ needs.upload.outputs.qualification-sha256 }}
          release-assets-directory: ${{ runner.temp }}/release-assets

      - name: Retain the verified release assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: ${{ runner.temp }}/release-assets/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
