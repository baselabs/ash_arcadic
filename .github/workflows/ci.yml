name: CI

# One qualification run per landing candidate: the candidate commit is pushed to `kci/<sha>`,
# the `qualified` job below is its verdict, and only then does main move to it. Nothing else
# starts this workflow; the ArcadeDB `latest` drift canary lives in canary.yml on a schedule.
on:
  push:
    branches: ['kci/**']

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Every run step is bash -eo pipefail: a failure behind a pipe fails its step.
defaults:
  run:
    shell: bash

jobs:
  # .tool-versions is the only home for runtime versions: its first version of each tool is
  # the default every job below runs on, and every other listed Elixir build, paired with
  # its Erlang by OTP major, is a compatibility lane. The lowest lane is the supported floor:
  # the locked dep chain binds there (ash 3.32 → crux/reactor → ex_ast ~> 1.18 and
  # yaml_elixir ~> 1.17), so a fresh resolution will not build below 1.18. CDC hosts also
  # need replicant's own floor (1.20.3+); replicant is optional, and the floor lane runs the
  # full suite with it because the lock pins it (it compiles on 1.18 with a requirement
  # warning only).
  toolchain:
    name: toolchain
    runs-on: ubuntu-24.04
    # floor 5 min for runner start-up; slowest green 0.2 min, run 44150018570
    timeout-minutes: 5 # 13 s, run 44189981688
    outputs:
      elixir: ${{ steps.versions.outputs.elixir }}
      otp: ${{ steps.versions.outputs.otp }}
      beam_lanes: ${{ steps.versions.outputs.beam_lanes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read defaults and compatibility lanes
        id: versions
        run: sh scripts/toolchain.sh >> "$GITHUB_OUTPUT"

  # Static checks on the default toolchain. The suite itself runs in
  # the `integration` job below, on every build. New-compiler warnings surface on the default
  # toolchain first (Elixir 1.20's unused-require and type-checker warnings were invisible on
  # the 1.18 lane).
  static:
    name: "static (Elixir ${{ needs.toolchain.outputs.elixir }} / OTP ${{ needs.toolchain.outputs.otp }})"
    needs: toolchain
    runs-on: ubuntu-24.04
    # 2x 8.3 min, run 44163206937
    timeout-minutes: 17 # 497 s, run 44163206937
    env:
      MIX_ENV: test

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Elixir/OTP
        uses: ./.github/actions/beam
        with:
          elixir-version: ${{ needs.toolchain.outputs.elixir }}
          otp-version: ${{ needs.toolchain.outputs.otp }}

      # Restore only: cache-warmer.yml on the default branch is the one writer.
      - name: Restore deps and _build
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ needs.toolchain.outputs.otp }}-${{ needs.toolchain.outputs.elixir }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-${{ needs.toolchain.outputs.otp }}-${{ needs.toolchain.outputs.elixir }}-

      - name: Install dependencies
        run: mix deps.get --check-locked

      # Formatter output is Elixir-version-dependent; the default toolchain's is canonical.
      - name: Check formatting
        run: mix format --check-formatted

      - name: Compile (warnings as errors)
        run: mix compile --warnings-as-errors

      - name: Credo
        run: mix credo --strict

      - name: Dependency audits (unused locks, retirements, and security advisories)
        run: mix audit

      - name: Restore the PLT
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: priv/plts
          key: ${{ runner.os }}-plt-${{ needs.toolchain.outputs.otp }}-${{ needs.toolchain.outputs.elixir }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-plt-${{ needs.toolchain.outputs.otp }}-${{ needs.toolchain.outputs.elixir }}-

      - name: Dialyzer
        run: mix dialyzer

  # Digest-pinned: `latest` is a moving SNAPSHOT, and the 26.8→26.9 jump changed DDL behavior
  # (FULL_TEXT over an implicitly auto-created property) under green CI, silently. Drift is
  # watched by canary.yml, which runs the same suite against `latest`. Bump deliberately:
  # tag and digest together, here only, landed like any change.
  integration:
    name: live suite (ArcadeDB 26.8.1)
    uses: ./.github/workflows/integration.yml
    with:
      image: arcadedata/arcadedb:26.8.1@sha256:49036720b1678b9c7a6dbf22fc34a812c8d7bed15508c22cbb02c0dddc0ca16a

  # Regression guard for the optional-dep contract: a non-CDC host must compile ash_arcadic
  # WITHOUT `replicant`. The AshArcadic.Replicant.{Apply,Sink.Impl,Pipeline} subtree is
  # compile-gated on Code.ensure_loaded?(Replicant.Sink); everything else is replicant-free.
  # Compile-only (no ArcadeDB service needed).
  compile-without-cdc:
    name: Compile without optional replicant (non-CDC host)
    needs: toolchain
    runs-on: ubuntu-24.04
    # 2x 2.4 min, run 29974064879
    timeout-minutes: 5 # 117 s, run 44190994631

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Elixir/OTP
        uses: ./.github/actions/beam
        with:
          elixir-version: ${{ needs.toolchain.outputs.elixir }}
          otp-version: ${{ needs.toolchain.outputs.otp }}

      - name: Install dependencies
        run: mix deps.get --check-locked

      - name: Compile the replicant-free subtree (optional replicant dep dropped)
        run: |
          # This CI checkout is disposable, so dropping the dep in place is safe. Assert the
          # dep line was actually removed (non-vacuity) so a mix.exs reformat can't turn this
          # guard into a silent pass.
          cp mix.exs "$RUNNER_TEMP/mix.exs.before"
          sed -i '/{:replicant,/d' mix.exs
          if cmp -s mix.exs "$RUNNER_TEMP/mix.exs.before"; then
            echo "::error::guard vacuous — the {:replicant, ...} dep line was not found in mix.exs; update this guard" >&2
            exit 1
          fi
          # The {:replicant, ...} dep is a single line today. If it were ever reformatted to a
          # multi-line tuple, the line-delete above would strip only a fragment and break mix.exs
          # syntax — which must NOT be confused with the gated-compile property failing. Fail with
          # a distinct message so a future reformat is fixed at the guard, not misread as a real bug.
          elixir -e 'Code.string_to_quoted!(File.read!("mix.exs"))' \
            || { echo "::error::guard broke mix.exs syntax (multi-line {:replicant, ...} tuple?) — harden the dep removal" >&2; exit 1; }
          mix deps.unlock replicant
          mix compile --force --warnings-as-errors

  # The release builds these docs; a warning here would ship on hexdocs.
  # Qualification builds and inspects the same archives as publication: a reproducible
  # package and one docs build.
  release-archives:
    needs: toolchain
    runs-on: ubuntu-24.04
    timeout-minutes: 5 # 93 s, run 44703078791
    env:
      MIX_ENV: dev
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/beam
        with:
          elixir-version: ${{ needs.toolchain.outputs.elixir }}
          otp-version: ${{ needs.toolchain.outputs.otp }}

      - name: Install the archive-building Hex client
        run: mix local.hex "$(cat scripts/release/hex-version)" --force

      # The warmer writes deps and both test and dev _build for the default toolchain.
      - name: Restore deps and _build
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ needs.toolchain.outputs.otp }}-${{ needs.toolchain.outputs.elixir }}-${{ hashFiles('mix.lock') }}

      - run: mix deps.get --check-locked

      - name: Test the release scripts
        run: python3 -I -B -m unittest discover -s scripts/release -p '*_test.py' -v

      - name: Build and inspect the release archives
        run: scripts/release/build_archives.sh "$RUNNER_TEMP/release"

  # The landing verdict: always runs, needs every other job in this workflow, and
  # passes only when each one's result is exactly `success` (skipped or cancelled refuses).
  qualified:
    if: always()
    needs: [toolchain, static, integration, compile-without-cdc, release-archives]
    runs-on: ubuntu-24.04
    # floor 5 min for runner start-up; slowest green 0.1 min, run 44125925649
    timeout-minutes: 5 # 5 s, run 44704425448
    steps:
      - name: Require every qualification job to succeed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          results = json.loads(os.environ['NEEDS'])
          failed = [name for name, job in results.items() if job['result'] != 'success']
          if failed:
              print('Qualification refused: ' + ', '.join(failed))
          sys.exit(bool(failed) or not results)
          PY
