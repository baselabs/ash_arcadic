name: CI

# One qualification run per landing candidate: the candidate commit is pushed to `kci/<sha>`,
# the `qualified` job below is its verdict, and only then does main move to it. Nothing else
# starts this workflow; the ArcadeDB `latest` drift canary lives in canary.yml on a schedule.
on:
  push:
    branches: ['kci/**']

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Every run step is bash -eo pipefail: a failure behind a pipe fails its step.
defaults:
  run:
    shell: bash

jobs:
  # .tool-versions is the only home for runtime versions: its first version of each tool is
  # the default every job below runs on, and every other listed Elixir build, paired with
  # its Erlang by OTP major, is a compatibility lane. The lowest lane is the supported floor:
  # the locked dep chain binds there (ash 3.32 → crux/reactor → ex_ast ~> 1.18 and
  # yaml_elixir ~> 1.17), so a fresh resolution will not build below 1.18. CDC hosts also
  # need replicant's own floor; integration reads that dependency's Elixir requirement and
  # tests an eligible CDC host or a replicant-free non-CDC host. The floor lane compiles
  # and tests the non-CDC tree, without bypassing replicant's requirement; `without-optional`
  # builds that tree on the default toolchain too.
  toolchain:
    name: toolchain
    runs-on: ubuntu-24.04
    # floor 5 min for runner start-up; slowest green 0.2 min, run 44150018570
    timeout-minutes: 5 # 13 s, run 44189981688
    outputs:
      elixir: ${{ steps.versions.outputs.elixir }}
      otp: ${{ steps.versions.outputs.otp }}
      beam_lanes: ${{ steps.versions.outputs.beam_lanes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read defaults and compatibility lanes
        id: versions
        run: scripts/toolchain.sh >> "$GITHUB_OUTPUT"

  # Static checks on the default toolchain. The suite itself runs in
  # the `integration` job below, on every build. New-compiler warnings surface on the default
  # toolchain first (Elixir 1.20's unused-require and type-checker warnings were invisible on
  # the 1.18 lane).
  static:
    name: "static (Elixir ${{ needs.toolchain.outputs.elixir }} / OTP ${{ needs.toolchain.outputs.otp }})"
    needs: toolchain
    runs-on: ubuntu-24.04
    # 2x 8.3 min, run 44163206937
    timeout-minutes: 17 # 497 s, run 44163206937
    env:
      MIX_ENV: test

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Elixir/OTP
        uses: ./.github/actions/beam
        with:
          elixir-version: ${{ needs.toolchain.outputs.elixir }}
          otp-version: ${{ needs.toolchain.outputs.otp }}

      - name: Check consumer install snippets
        run: |
          elixir scripts/check_install_snippets_test.exs
          elixir scripts/check_install_snippets.exs

      # Restore only: cache-warmer.yml on the default branch is the one writer.
      - name: Restore deps and _build
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ needs.toolchain.outputs.otp }}-${{ needs.toolchain.outputs.elixir }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-${{ needs.toolchain.outputs.otp }}-${{ needs.toolchain.outputs.elixir }}-

      - name: Install dependencies
        run: mix deps.get --check-locked

      # Formatter output is Elixir-version-dependent; the default toolchain's is canonical.
      - name: Check formatting
        run: mix format --check-formatted

      - name: Compile (warnings as errors)
        run: mix compile --warnings-as-errors

      - name: Credo
        run: mix credo --strict

      - name: Dependency audits (unused locks, retirements, and security advisories)
        run: mix audit

      - name: Restore the PLT
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: priv/plts
          key: ${{ runner.os }}-plt-${{ needs.toolchain.outputs.otp }}-${{ needs.toolchain.outputs.elixir }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-plt-${{ needs.toolchain.outputs.otp }}-${{ needs.toolchain.outputs.elixir }}-

      - name: Dialyzer
        run: mix dialyzer

  # The smallest host on the default toolchain: every optional dependency removed (replicant
  # today), so each one's absent branch compiles with warnings as errors and the unit suite
  # runs without it. Host mode drops an optional dependency on a lane only when that lane's
  # Elixir cannot run it; this job does not depend on any lane's Elixir, so the absent tree
  # stays built when every lane can run every dependency.
  without-optional:
    name: "without optional deps (Elixir ${{ needs.toolchain.outputs.elixir }} / OTP ${{ needs.toolchain.outputs.otp }})"
    needs: toolchain
    runs-on: ubuntu-24.04
    # 2x (29 s on a restored cache, run 44737119166, + 206 s cold dependency build, warmer
    # run 44703667524); measure again on its first cold green run
    timeout-minutes: 8 # 235 s, runs 44737119166 + 44703667524
    env:
      MIX_ENV: test

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Elixir/OTP
        uses: ./.github/actions/beam
        with:
          elixir-version: ${{ needs.toolchain.outputs.elixir }}
          otp-version: ${{ needs.toolchain.outputs.otp }}

      # Restore only: cache-warmer.yml on the default branch is the one writer.
      - name: Restore deps and _build
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ needs.toolchain.outputs.otp }}-${{ needs.toolchain.outputs.elixir }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-${{ needs.toolchain.outputs.otp }}-${{ needs.toolchain.outputs.elixir }}-

      - name: Install dependencies
        run: mix deps.get --check-locked

      - name: Remove every optional dependency
        run: elixir scripts/ci_host_mode.exs --without-optional

      - name: Compile (warnings as errors)
        run: mix compile --force --warnings-as-errors

      - name: Unit suite
        run: mix test --warnings-as-errors

  # Digest-pinned: `latest` is a moving SNAPSHOT, and the 26.8→26.9 jump changed DDL behavior
  # (FULL_TEXT over an implicitly auto-created property) under green CI, silently. Drift is
  # watched by canary.yml, which runs the same suite against `latest`. Bump deliberately:
  # tag and digest together, here only, landed like any change.
  integration:
    name: live suite (ArcadeDB 26.11.1)
    uses: ./.github/workflows/integration.yml
    with:
      image: arcadedata/arcadedb:26.11.1@sha256:22a049898f34f01c256b56a1ba95fb01d32e5e14755d3c4367415c8e55ae5035

  # Publication uses the exact package and docs archives qualified here.
  release-archives:
    needs: toolchain
    runs-on: ubuntu-24.04
    timeout-minutes: 90 # 2 min 22 s warm, run 46073930711; cold qualification and consumer compile not yet measured
    env:
      MIX_ENV: dev
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/beam
        with:
          elixir-version: ${{ needs.toolchain.outputs.elixir }}
          otp-version: ${{ needs.toolchain.outputs.otp }}

      - name: Install the shared action's Hex client
        working-directory: ${{ runner.temp }}
        run: |
          test ! -e mix.exs
          hex_version="$(curl --fail --silent --show-error --max-time 30 'https://raw.githubusercontent.com/baselabs/.github/654fcd0ef63daf8e3f79dfeb4ca900adffd0d4e2/.github/actions/hex-publish/hex-version')"
          [[ "$hex_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          mix local.hex "$hex_version" --force

      - name: Qualify the Hex package and docs
        uses: baselabs/.github/.github/actions/hex-publish@654fcd0ef63daf8e3f79dfeb4ca900adffd0d4e2
        with:
          operation: qualify
          package: ash_arcadic
          package-directory: .

  # The qualify step removes its scratch directory when it ends, so the rebuild
  # comparison runs in its own job against the uploaded artifact.
  package-rebuild:
    needs: [toolchain, release-archives]
    runs-on: ubuntu-24.04
    timeout-minutes: 15 # 16 s, run 46073930711
    env:
      MIX_ENV: dev
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/beam
        with:
          elixir-version: ${{ needs.toolchain.outputs.elixir }}
          otp-version: ${{ needs.toolchain.outputs.otp }}

      - name: Install the shared action's Hex client
        working-directory: ${{ runner.temp }}
        run: |
          test ! -e mix.exs
          hex_version="$(curl --fail --silent --show-error --max-time 30 'https://raw.githubusercontent.com/baselabs/.github/654fcd0ef63daf8e3f79dfeb4ca900adffd0d4e2/.github/actions/hex-publish/hex-version')"
          [[ "$hex_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          mix local.hex "$hex_version" --force

      - run: mix deps.get --check-locked

      - name: Retrieve the qualified package for the reproducibility check
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: hex-hexpm-ash_arcadic
          path: ${{ runner.temp }}/qualified-hex

      - name: Require a byte-for-byte package rebuild
        run: |
          archives="$RUNNER_TEMP/qualified-hex"
          trap 'rm -rf -- "$archives"' EXIT
          mix hex.build --output "$archives/rebuilt.tar"
          cmp "$archives/package.tar" "$archives/rebuilt.tar"

  # The landing verdict: always runs, needs every other job in this workflow, and
  # passes only when each one's result is exactly `success` (skipped or cancelled refuses).
  qualified:
    if: always()
    needs: [toolchain, static, without-optional, integration, release-archives, package-rebuild]
    runs-on: ubuntu-24.04
    # floor 5 min for runner start-up; slowest green 0.1 min, run 44125925649
    timeout-minutes: 5 # 5 s, run 44704425448
    steps:
      - name: Require every qualification job to succeed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          results = json.loads(os.environ['NEEDS'])
          failed = [name for name, job in results.items() if job['result'] != 'success']
          if failed:
              print('Qualification refused: ' + ', '.join(failed))
          sys.exit(bool(failed) or not results)
          PY
