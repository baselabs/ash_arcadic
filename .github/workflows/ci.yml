name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: test (elixir ${{ matrix.elixir }} / otp ${{ matrix.otp }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          # Supported floor. The locked dep chain binds here: ash 3.32 → crux/reactor →
          # ex_ast (~> 1.18) and yaml_elixir (~> 1.17); a fresh resolution will not build
          # below 1.18. CDC hosts additionally need replicant's own floor (1.20.3+), but
          # replicant is optional — the floor lane runs the full suite WITH it because the
          # lock pins it here (it compiles on 1.18 with a requirement warning only).
          - elixir: "1.18.3"
            otp: "27.3"
          # Current (latest stable release pair). New-compiler warnings surface here
          # first — Elixir 1.20's unused-require and type-checker warnings were
          # invisible on the 1.18 lane. Dialyzer runs on this one only.
          - elixir: "1.20.3"
            otp: "29.0.5"
            dialyzer: true

    services:
      arcadedb:
        # Digest-pinned: `latest` is a moving SNAPSHOT (as of 2026-08-22 it is
        # 26.9.1-SNAPSHOT), and the 26.8→26.9 jump changed DDL behavior (FULL_TEXT
        # over an implicitly auto-created property) — under green CI, silently.
        # The full 785-test suite is verified on 26.8.1. Drift is watched by the
        # non-blocking arcadedb-latest-canary job below. Bump deliberately:
        # re-verify the suite locally, then update tag AND digest together.
        image: arcadedata/arcadedb:26.8.1@sha256:49036720b1678b9c7a6dbf22fc34a812c8d7bed15508c22cbb02c0dddc0ca16a
        ports:
          - 2480:2480
        env:
          JAVA_OPTS: >-
            -Darcadedb.server.rootPassword=arcadedb_dev_password
            -Darcadedb.server.mode=development

    env:
      MIX_ENV: test
      ARCADIC_TEST_URL: http://localhost:2480
      ARCADIC_TEST_PASSWORD: arcadedb_dev_password

    steps:
      - uses: actions/checkout@v4

      - name: Set up Elixir/OTP
        uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}

      - name: Cache deps and _build
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ matrix.otp }}-${{ matrix.elixir }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-${{ matrix.otp }}-${{ matrix.elixir }}-

      - name: Install dependencies
        run: mix deps.get

      - name: Check formatting
        run: mix format --check-formatted

      - name: Compile (warnings as errors)
        run: mix compile --warnings-as-errors

      - name: Credo
        run: mix credo --strict

      - name: Hex audit (retired packages + security advisories)
        run: mix hex.audit

      - name: Wait for ArcadeDB to be ready
        run: |
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' -u "root:$ARCADIC_TEST_PASSWORD" http://localhost:2480/api/v1/ready || true)
            if [ "$code" = "204" ]; then echo "ArcadeDB ready"; exit 0; fi
            echo "waiting for ArcadeDB ($i)... last=$code"; sleep 2
          done
          echo "ArcadeDB did not become ready in time" >&2
          exit 1

      - name: Test (unit + integration)
        run: mix test --include integration

      - name: Cache PLT
        if: matrix.dialyzer
        uses: actions/cache@v4
        with:
          path: priv/plts
          key: ${{ runner.os }}-plt-${{ matrix.otp }}-${{ matrix.elixir }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-plt-${{ matrix.otp }}-${{ matrix.elixir }}-

      - name: Dialyzer
        if: matrix.dialyzer
        run: mix dialyzer

  # Regression guard for the optional-dep contract: a non-CDC host must compile ash_arcadic
  # WITHOUT `replicant`. The AshArcadic.Replicant.{Apply,Sink.Impl,Pipeline} subtree is
  # compile-gated on Code.ensure_loaded?(Replicant.Sink); everything else is replicant-free.
  # Compile-only (no ArcadeDB service needed).
  compile-without-cdc:
    name: Compile without optional replicant (non-CDC host)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Elixir/OTP
        uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.20.3"
          otp-version: "29.0.5"

      - name: Install dependencies
        run: mix deps.get

      - name: Compile the replicant-free subtree (optional replicant dep dropped)
        run: |
          # This CI checkout is disposable, so dropping the dep in place is safe. Assert the
          # dep line was actually removed (non-vacuity) so a mix.exs reformat can't turn this
          # guard into a silent pass.
          before=$(md5sum mix.exs | cut -d' ' -f1)
          sed -i '/{:replicant,/d' mix.exs
          after=$(md5sum mix.exs | cut -d' ' -f1)
          if [ "$before" = "$after" ]; then
            echo "::error::guard vacuous — the {:replicant, ...} dep line was not found in mix.exs; update this guard" >&2
            exit 1
          fi
          # The {:replicant, ...} dep is a single line today. If it were ever reformatted to a
          # multi-line tuple, the line-delete above would strip only a fragment and break mix.exs
          # syntax — which must NOT be confused with the gated-compile property failing. Fail with
          # a distinct message so a future reformat is fixed at the guard, not misread as a real bug.
          elixir -e 'Code.string_to_quoted!(File.read!("mix.exs"))' \
            || { echo "::error::guard broke mix.exs syntax (multi-line {:replicant, ...} tuple?) — harden the dep removal" >&2; exit 1; }
          mix deps.unlock replicant
          mix compile --force --warnings-as-errors

  # Non-blocking drift tripwire: the test lanes run a digest-pinned ArcadeDB so
  # they stay reproducible; this job runs the same suite against `latest` so an
  # upstream behavior change (e.g. the 26.8→26.9 FULL_TEXT DDL change) surfaces
  # HERE, loudly, instead of silently inside a green pinned lane. A red canary
  # is information for the next deliberate pin bump, not a merge block.
  arcadedb-latest-canary:
    name: canary (ArcadeDB latest)
    runs-on: ubuntu-latest
    continue-on-error: true

    services:
      arcadedb:
        image: arcadedata/arcadedb:latest
        ports:
          - 2480:2480
        env:
          JAVA_OPTS: >-
            -Darcadedb.server.rootPassword=arcadedb_dev_password
            -Darcadedb.server.mode=development

    env:
      MIX_ENV: test
      ARCADIC_TEST_URL: http://localhost:2480
      ARCADIC_TEST_PASSWORD: arcadedb_dev_password

    steps:
      - uses: actions/checkout@v4

      - name: Set up Elixir/OTP
        uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.20.3"
          otp-version: "29.0.5"

      # Distinct key so the canary never evicts a pinned lane's cache; restore
      # falls back to the pinned 1.20.3 lane's cache (same deps/build content).
      - name: Cache deps and _build
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-29.0.5-1.20.3-canary-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-29.0.5-1.20.3-

      - name: Install dependencies
        run: mix deps.get

      - name: Wait for ArcadeDB to be ready
        run: |
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' -u "root:$ARCADIC_TEST_PASSWORD" http://localhost:2480/api/v1/ready || true)
            if [ "$code" = "204" ]; then echo "ArcadeDB ready"; exit 0; fi
            echo "waiting for ArcadeDB ($i)... last=$code"; sleep 2
          done
          echo "ArcadeDB did not become ready in time" >&2
          exit 1

      - name: Test (unit + integration) against latest
        run: mix test --include integration
