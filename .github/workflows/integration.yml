name: Live integration

# The full suite (unit + live integration) on every Elixir build .tool-versions lists, and
# every shipped notebook on the default build. Shared by two callers: ci.yml runs it against
# a digest-pinned ArcadeDB image so a landing's verdict is reproducible, and canary.yml runs it against the moving `latest` image so
# upstream drift surfaces before the next deliberate pin bump.
on:
  workflow_call:
    inputs:
      image:
        description: ArcadeDB image reference (tag, or tag@digest)
        required: true
        type: string

permissions:
  contents: read

jobs:
  # The default build and every compatibility lane, paired with its Erlang by OTP major.
  toolchain:
    name: toolchain
    runs-on: ubuntu-24.04
    # floor 5 min for runner start-up; slowest green 0.2 min, run 44157254512
    timeout-minutes: 5
    outputs:
      builds: ${{ steps.builds.outputs.builds }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read defaults and compatibility lanes
        id: versions
        run: sh scripts/toolchain.sh >> "$GITHUB_OUTPUT"
      - name: List every build
        id: builds
        env:
          ELIXIR: ${{ steps.versions.outputs.elixir }}
          OTP: ${{ steps.versions.outputs.otp }}
          LANES: ${{ steps.versions.outputs.beam_lanes }}
        run: |
          echo "builds=$(jq -cn --arg e "$ELIXIR" --arg o "$OTP" --argjson lanes "$LANES" \
            '[{elixir: $e, otp: $o}] + $lanes')" >> "$GITHUB_OUTPUT"

  suite:
    name: "suite (Elixir ${{ matrix.elixir }} / OTP ${{ matrix.otp }})"
    needs: toolchain
    runs-on: ubuntu-24.04
    # 2x 2.5 min, run 44157784640
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.toolchain.outputs.builds) }}

    services:
      arcadedb:
        image: ${{ inputs.image }}
        ports:
          - 2480:2480
        env:
          JAVA_OPTS: >-
            -Darcadedb.server.rootPassword=arcadedb_dev_password
            -Darcadedb.server.mode=development

    env:
      MIX_ENV: test
      ARCADIC_TEST_URL: http://localhost:2480
      ARCADIC_TEST_PASSWORD: arcadedb_dev_password

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Elixir/OTP
        uses: ./.github/actions/beam
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}

      # Restore only: cache-warmer.yml on the default branch is the one writer.
      - name: Restore deps and _build
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ matrix.otp }}-${{ matrix.elixir }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-${{ matrix.otp }}-${{ matrix.elixir }}-

      - name: Install dependencies
        run: mix deps.get --check-locked

      - name: Compile (warnings as errors)
        run: mix compile --warnings-as-errors

      - name: Credo
        run: mix credo --strict

      - name: Wait for ArcadeDB to be ready
        run: |
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' -u "root:$ARCADIC_TEST_PASSWORD" http://localhost:2480/api/v1/ready || true)
            if [ "$code" = "204" ]; then echo "ArcadeDB ready"; exit 0; fi
            echo "waiting for ArcadeDB ($i)... last=$code"; sleep 2
          done
          echo "ArcadeDB did not become ready in time" >&2
          exit 1

      - name: Report the ArcadeDB version under test
        run: |
          curl -s -u "root:$ARCADIC_TEST_PASSWORD" "http://localhost:2480/api/v1/server?mode=basic" \
            | python3 -c 'import json,sys; print("ArcadeDB", json.load(sys.stdin).get("version"))' || true

      - name: Test (unit + integration)
        run: mix test --warnings-as-errors --include integration

  # Every notebook the Hex package ships runs top to bottom against this checkout and a live
  # server. The list comes from the built package, so a new notebook is covered with no edit
  # here; a tracked notebook the package leaves out, or one with no elixir cells, fails.
  notebooks:
    name: notebooks
    runs-on: ubuntu-24.04
    # 2x 1.6 min, run 44163206937, raised to the 5 min floor
    timeout-minutes: 5
    env:
      PW: probe-test-pw
      ARCADEDB_IMAGE: ${{ inputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read the default toolchain
        id: versions
        run: sh scripts/toolchain.sh >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/beam
        with:
          elixir-version: ${{ steps.versions.outputs.elixir }}
          otp-version: ${{ steps.versions.outputs.otp }}

      # No cache: each notebook builds in its own Mix.install project, and this checkout's deps
      # are fetched only to build the package.
      - run: mix deps.get --check-locked

      - name: Build and inspect the package and list its notebooks
        run: |
          VERSION=$(mix run --no-start --no-compile --no-deps-check -e 'IO.puts(Mix.Project.config()[:version])')
          export VERSION
          mix hex.build --unpack --output "$RUNNER_TEMP/package"
          elixir scripts/inspect_package.exs "$RUNNER_TEMP/package" "$RUNNER_TEMP/package/hex_metadata.config"
          (cd "$RUNNER_TEMP/package" && find . -name '*.livemd' | sed 's|^\./||' | sort) > "$RUNNER_TEMP/shipped"
          git ls-files '*.livemd' | sort > "$RUNNER_TEMP/tracked"
          unshipped=$(comm -23 "$RUNNER_TEMP/tracked" "$RUNNER_TEMP/shipped")
          if [ -n "$unshipped" ]; then
            echo "Notebooks the package does not ship:"; echo "$unshipped"; exit 1
          fi
          if [ ! -s "$RUNNER_TEMP/shipped" ]; then
            echo "The package ships no notebooks"; exit 1
          fi
          cat "$RUNNER_TEMP/shipped"

      # Vector, full-text, and graph operations use HTTP; the CDC example hand-builds
      # its transaction. No server plugins or Postgres service are needed.
      - name: Start ArcadeDB (HTTP)
        run: |
          docker run -d --name ash-arcadic-notebooks -p 2480:2480 \
            -e JAVA_OPTS="-Darcadedb.server.rootPassword=$PW" \
            "$ARCADEDB_IMAGE"
          for _ in $(seq 1 60); do
            [ "$(curl -s -o /dev/null -w '%{http_code}' -u "root:$PW" http://localhost:2480/api/v1/ready)" = "204" ] && exit 0
            sleep 2
          done
          docker logs ash-arcadic-notebooks && exit 1

      - name: Run every shipped notebook
        env:
          ARCADEDB_URL: http://localhost:2480
          ARCADEDB_PASSWORD: ${{ env.PW }}
        run: |
          failed=""
          while read -r notebook; do
            echo "::group::$notebook"
            elixir scripts/run_notebook.exs "$notebook" < /dev/null || failed="$failed $notebook"
            echo "::endgroup::"
          done < "$RUNNER_TEMP/shipped"
          if [ -n "$failed" ]; then
            echo "Failed notebooks:$failed"; exit 1
          fi
